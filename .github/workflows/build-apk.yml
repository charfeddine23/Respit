name: Build & Release Debug APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Release Name (اسم الإصدار)'
        required: false
        default: 'Charfeddine Ka v1.40.2'
      release_tag:
        description: 'Release Tag (وسم الإصدار)'
        required: false
        default: 'v1.40.2'
      create_release:
        description: 'Publish as GitHub Release (نشر في GitHub Releases)'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Restore or Generate Debug Keystore
        run: |
          echo "Configuring Android debug signing keystore..."
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            echo "Decoding debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            echo "Generating fallback debug keystore..."
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          test -f debug.keystore && echo "Debug keystore is ready."

      - name: Setup Environment File
        run: |
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            echo "Copying .env.example to .env..."
            cp .env.example .env
          elif [ ! -f ".env" ]; then
            touch .env
          fi

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Organize Output APK Files
        run: |
          mkdir -p output-apk
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: Debug APK not found in app/build/outputs/apk/debug"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" output-apk/MyAppv1.40.2.apk
          cp "$APK_PATH" output-apk/MyApp-v1.40.2.apk
          cp "$APK_PATH" output-apk/MyApp.apk
          cp "$APK_PATH" output-apk/Ck-v1.40.2.apk
          cp "$APK_PATH" output-apk/Ck.apk
          cp "$APK_PATH" output-apk/Permission-CK.apk
          cp "$APK_PATH" output-apk/Permission-CK.v2.apk
          cp "$APK_PATH" output-apk/CharfeddineKa-debug.apk
          cp "$APK_PATH" output-apk/app-debug.apk
          ls -la output-apk

      - name: Upload APK as Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CharfeddineKa-apk-v1.40.2
          path: |
            output-apk/MyAppv1.40.2.apk
            output-apk/MyApp-v1.40.2.apk
            output-apk/MyApp.apk
            output-apk/Ck-v1.40.2.apk
            output-apk/Ck.apk
            output-apk/Permission-CK.apk
            output-apk/Permission-CK.v2.apk
          retention-days: 30

      - name: Resolve Release Metadata
        id: release_info
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            echo "tag_name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "release_name=Release ${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_INPUT="${{ github.event.inputs.release_tag }}"
            NAME_INPUT="${{ github.event.inputs.release_name }}"
            echo "tag_name=${TAG_INPUT:-v1.40.2}" >> "$GITHUB_OUTPUT"
            echo "release_name=${NAME_INPUT:-Charfeddine Ka Release v1.40.2}" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=v1.40.2" >> "$GITHUB_OUTPUT"
            echo "release_name=Charfeddine Ka - MyAppv1.40.2.apk" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Direct APK Download to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: ${{ steps.release_info.outputs.release_name }}
          draft: false
          prerelease: ${{ steps.release_info.outputs.is_prerelease == 'true' }}
          make_latest: true
          files: |
            output-apk/MyAppv1.40.2.apk
            output-apk/MyApp-v1.40.2.apk
            output-apk/MyApp.apk
            output-apk/Ck-v1.40.2.apk
            output-apk/Ck.apk
            output-apk/Permission-CK.apk
            output-apk/Permission-CK.v2.apk
          body: |
            ### 📱 تطبيق Charfeddine Ka - نظام تتبع إجازات وعطل الأفراد (الإصدار V1.40.2)

            **اسم ملف التطبيق:** `MyAppv1.40.2.apk` / `MyApp-v1.40.2.apk` / `MyApp.apk` / `Ck-v1.40.2.apk` / `Ck.apk` / `Permission-CK.apk`
            **رقم الإصدار:** `1.40.2` (Code 140)
            **نوع الحزمة:** ملف تثبيت مباشر للأندرويد (Debug APK جاهز للتثبيت الفوري)
            **الالتزام (Commit):** `${{ github.sha }}`

            ---

            #### 📥 روابط التحميل المباشر لملف الـ APK بنقرة واحدة:
            - **[تحميل MyAppv1.40.2.apk مباشرة (Direct Download)](https://github.com/${{ github.repository }}/releases/download/${{ steps.release_info.outputs.tag_name }}/MyAppv1.40.2.apk)**
            - **[تحميل MyApp-v1.40.2.apk مباشرة (Direct Download)](https://github.com/${{ github.repository }}/releases/download/${{ steps.release_info.outputs.tag_name }}/MyApp-v1.40.2.apk)**
            - **[تحميل MyApp.apk مباشرة (Direct Download)](https://github.com/${{ github.repository }}/releases/download/${{ steps.release_info.outputs.tag_name }}/MyApp.apk)**
            - **[تحميل Ck-v1.40.2.apk مباشرة (Direct Download)](https://github.com/${{ github.repository }}/releases/download/${{ steps.release_info.outputs.tag_name }}/Ck-v1.40.2.apk)**
            - **[تحميل Ck.apk مباشرة (Direct Download)](https://github.com/${{ github.repository }}/releases/download/${{ steps.release_info.outputs.tag_name }}/Ck.apk)**
            - **[تحميل Permission-CK.apk مباشرة (Direct Download)](https://github.com/${{ github.repository }}/releases/download/${{ steps.release_info.outputs.tag_name }}/Permission-CK.apk)**

            ---

            #### 🚀 أبرز تحديثات وميزات الإصدار 1.40.2:
            - 🔔 **قائمة وتوجيه التنبيهات الجديدة (Notification Center)**:
              - واجهة خاصة للتنبيهات تستعرض الإشعارات الذكية للأفراد (الدخول اليوم، التأخر، الإجازات القادمة، استحقاق الإجازة).
              - إمكانية **تثبيت (Pinning)** الإشعارات المهمة لتظهر دائماً في أعلى القائمة مع مؤشر ذهبي.
              - إمكانية **مسح أو حذف** إشعار محدد، أو مسح كافة التنبيهات دفعة واحدة.
              - زر رجوع سلس مع تكامل كامل مع زر الرجوع لنظام أندرويد (`BackHandler`).
            - 🎯 **أيقونة الإشعارات العلوية**: تصميم حديث بزوايا دائرية خفيفة (`Rounded Corners`) وعداد شارات حي.
            - 🎨 **أيقونة التطبيق الموحدة (Launcher Icon)**: مطابقة تامة للأيقونة المعتمدة داخل التطبيق لتوحيد الهوية البصرية.
            - 🕒 **سجل عمليات البحث الأخيرة (Recent Searches)**: حفظ آخر 5 عمليات بحث لسرعة وسلاسة الوصول.
            - 📅 **تنسيق التواريخ المحكم**: عرض التواريخ بصيغة اليوم-الشهر-السنة (`dd-MM-yyyy`) باتجاه LTR واضح ومقروء.
            - 🌓 **تبديل فوري للوضع الليلي والنهاري** عبر الضغط المباشر على عنوان التطبيق في الشريط العلوي.
            - 💎 **تصميم الزجاج السائل الفاخر (Liquid Glass)** مع الحفاظ الدقيق على الألوان المعتمدة وسرعة استجابة فائقة.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
