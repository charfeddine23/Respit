name: Android Release Build & Publish

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'ملاحظات الإصدار (Release Notes)'
        required: false
        default: 'تحديث تلقائي وتحسينات شاملة للتطبيق'

permissions:
  contents: write
  actions: write

concurrency:
  group: android-release-pipeline
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build Signed Release APK & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Resolve Dynamic App Name & Auto-Increment Version
        id: version_info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          REPO: ${{ github.repository }}
        run: |
          python3 - << 'PYEOF'
          import json, os, re, subprocess, xml.etree.ElementTree as ET

          # 1. Extract app_name from strings.xml and sanitize for APK filename ([app_name].v1.x.x.apk)
          app_prefix = "RespitePulse"
          strings_path = "app/src/main/res/values/strings.xml"
          if os.path.exists(strings_path):
              try:
                  tree = ET.parse(strings_path)
                  for elem in tree.getroot().findall("string"):
                      if elem.attrib.get("name") == "app_name" and elem.text:
                          cleaned = re.sub(r"[^A-Za-z0-9._-]", "", elem.text.strip())
                          if cleaned:
                              app_prefix = cleaned
                          break
              except Exception:
                  pass

          # 2. Compute baseline version from build number
          run_number = int(os.environ.get("GITHUB_RUN_NUMBER", "1") or "1")
          base_major, base_minor, base_patch, base_code = 1, 42, 4, 144
          total_patch = base_patch + run_number
          run_minor = base_minor + (total_patch // 100)
          run_patch = total_patch % 100
          best_ver = (base_major, run_minor, run_patch)
          best_code = base_code + run_number

          # 3. Inspect existing GitHub Releases & git tags so every push strictly advances version
          def parse_ver(s):
              m = re.search(r"v?1\.(\d+)\.(\d+)", s or "")
              return (1, int(m.group(1)), int(m.group(2))) if m else None

          repo = os.environ.get("REPO", "")
          try:
              out = subprocess.check_output(
                  ["gh", "api", f"repos/{repo}/releases?per_page=100"],
                  text=True,
                  stderr=subprocess.DEVNULL
              )
              releases = json.loads(out or "[]")
              if isinstance(releases, list):
                  for rel in releases:
                      v = parse_ver(rel.get("tag_name", "")) or parse_ver(rel.get("name", ""))
                      if v and v >= best_ver:
                          np = v[2] + 1
                          nm = v[1] + (np // 100)
                          best_ver = (1, nm, np % 100)
                      body = rel.get("body", "") or ""
                      cm = re.search(r"(?:Version Code|كود الإصدار)[^0-9]*(\d+)", body)
                      if cm:
                          best_code = max(best_code, int(cm.group(1)) + 1)
          except Exception:
              pass

          try:
              tags_out = subprocess.check_output(["git", "tag", "-l", "v*"], text=True, stderr=subprocess.DEVNULL)
              for line in tags_out.splitlines():
                  v = parse_ver(line.strip())
                  if v and v >= best_ver:
                      np = v[2] + 1
                      nm = v[1] + (np // 100)
                      best_ver = (1, nm, np % 100)
          except Exception:
              pass

          version_name = f"{best_ver[0]}.{best_ver[1]}.{best_ver[2]}"
          tag_name = f"v{version_name}"
          apk_filename = f"{app_prefix}.v{version_name}.apk"
          app_id = "com.aistudio.leavetracker.kpqvbn"

          print(f"App Prefix: {app_prefix}")
          print(f"Computed Version Name: {version_name}")
          print(f"Computed Version Code: {best_code}")
          print(f"Target APK Filename: {apk_filename}")

          gh_out = os.environ["GITHUB_OUTPUT"]
          with open(gh_out, "a", encoding="utf-8") as f:
              f.write(f"app_prefix={app_prefix}\n")
              f.write(f"version_name={version_name}\n")
              f.write(f"version_code={best_code}\n")
              f.write(f"application_id={app_id}\n")
              f.write(f"tag_name={tag_name}\n")
              f.write(f"apk_filename={apk_filename}\n")
          PYEOF

      - name: Configure Permanent Signing Keystore
        id: keystore_setup
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="${GITHUB_WORKSPACE}/my-upload-key.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using production signing keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
            STORE_PASS="${STORE_PASSWORD:-android}"
            KEY_PASS="${KEY_PASSWORD:-android}"
          elif [ -f "my-upload-key.jks.base64" ]; then
            echo "Restoring permanent repository release signing keystore (in-place update compatible)..."
            base64 -d my-upload-key.jks.base64 > "$KEYSTORE_FILE"
            STORE_PASS="android"
            KEY_PASS="android"
          elif [ -f "my-upload-key.jks" ]; then
            echo "Using repository release signing keystore..."
            STORE_PASS="android"
            KEY_PASS="android"
          else
            echo "ERROR: Permanent release keystore missing! Aborting to prevent breaking in-place updates."
            exit 1
          fi

          # Verify alias and fingerprint for consistent in-place updates
          keytool -list -v -keystore "$KEYSTORE_FILE" -storepass "$STORE_PASS" -alias upload | grep -E "Alias name:|SHA256:"
          echo "store_pass=$STORE_PASS" >> "$GITHUB_OUTPUT"
          echo "key_pass=$KEY_PASS" >> "$GITHUB_OUTPUT"

      - name: Setup Environment File (.env)
        run: |
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          elif [ ! -f ".env" ]; then
            touch .env
          fi

      - name: Build Signed Release APK with Gradle
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          APP_VERSION_NAME: ${{ steps.version_info.outputs.version_name }}
          APP_VERSION_CODE: ${{ steps.version_info.outputs.version_code }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ steps.keystore_setup.outputs.store_pass }}
          KEY_PASSWORD: ${{ steps.keystore_setup.outputs.key_pass }}
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
        run: |
          echo "Building signed Release APK v${APP_VERSION_NAME} (code ${APP_VERSION_CODE})..."
          ./gradlew :app:assembleRelease --no-daemon --stacktrace -Djava.awt.headless=true

      - name: Rename APK & Verify In-Place Update Signature
        run: |
          mkdir -p release-apk
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          fi

          if [ -z "$APK_PATH" ]; then
            echo "Error: Release APK not found in build outputs!"
            exit 1
          fi

          TARGET_APK="release-apk/${{ steps.version_info.outputs.apk_filename }}"
          cp "$APK_PATH" "$TARGET_APK"
          ls -lh "$TARGET_APK"

          APKSIGNER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name "apksigner" 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$TARGET_APK"
          fi

      - name: Clean Up Actions History & Old Artifacts (Keep Only Current Run)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Deleting all old workflow artifacts..."
          ARTIFACT_IDS=$(gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" --jq '.artifacts[].id' 2>/dev/null || true)
          for art_id in $ARTIFACT_IDS; do
            if [ -n "$art_id" ]; then
              gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$art_id" 2>/dev/null || true
            fi
          done

          echo "Cleaning up old workflow run history (preserving active run ${{ github.run_id }})..."
          RUN_IDS=$(gh api --paginate "repos/${{ github.repository }}/actions/runs?per_page=100" --jq ".workflow_runs[] | select(.id != ${{ github.run_id }}) | .id" 2>/dev/null || true)
          for run_id in $RUN_IDS; do
            if [ -n "$run_id" ]; then
              if ! gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$run_id" 2>/dev/null; then
                gh api -X POST "repos/${{ github.repository }}/actions/runs/$run_id/cancel" 2>/dev/null || true
                sleep 1
                gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$run_id" 2>/dev/null || true
              fi
              echo "Removed old workflow run ID: $run_id"
            fi
          done

      - name: Delete All Older Releases and Tags (Keep Only Latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Removing all previous GitHub releases (including drafts/prereleases)..."
          REL_IDS=$(gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" --jq '.[].id' 2>/dev/null || true)
          for rel_id in $REL_IDS; do
            if [ -n "$rel_id" ]; then
              echo "Deleting release ID: $rel_id"
              gh api -X DELETE "repos/${{ github.repository }}/releases/$rel_id" 2>/dev/null || true
            fi
          done

          echo "Removing all old git tags so only the latest version tag exists..."
          TAG_REFS=$(gh api --paginate "repos/${{ github.repository }}/git/matching-refs/tags?per_page=100" --jq '.[].ref' 2>/dev/null || true)
          for ref in $TAG_REFS; do
            TAG_NAME="${ref#refs/tags/}"
            if [ -n "$TAG_NAME" ]; then
              echo "Deleting tag: $TAG_NAME"
              gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/${TAG_NAME}" 2>/dev/null || true
            fi
          done

      - name: Publish Latest GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_info.outputs.tag_name }}
          name: "Respite Pulse v${{ steps.version_info.outputs.version_name }}"
          draft: false
          prerelease: false
          make_latest: true
          files: release-apk/${{ steps.version_info.outputs.apk_filename }}
          body: |
            ## 📱 تطبيق Respite Pulse v${{ steps.version_info.outputs.version_name }}

            ### 📋 معلومات الإصدار (Release Info)
            - **اسم ملف APK:** `${{ steps.version_info.outputs.apk_filename }}`
            - **رقم الإصدار (Version Name):** `${{ steps.version_info.outputs.version_name }}`
            - **كود الإصدار (Version Code):** `${{ steps.version_info.outputs.version_code }}`
            - **معرّف الحزمة (Application ID):** `${{ steps.version_info.outputs.application_id }}`
            - **التوافق:** يدعم التحديث المباشر فوق النسخة المثبتة مسبقاً دون حذف التطبيق أو فقدان البيانات (توقيع موحد دائم).

            ---

            ### 📥 التحميل المباشر (Direct Download)
            - **[تحميل ${{ steps.version_info.outputs.apk_filename }}](https://github.com/${{ github.repository }}/releases/download/${{ steps.version_info.outputs.tag_name }}/${{ steps.version_info.outputs.apk_filename }})**

            - **ملاحظات التحديث:** ${{ github.event.inputs.release_notes || 'تحديث تلقائي مباشر عند الرفع إلى GitHub' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
