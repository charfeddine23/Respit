name: Android Release Build & Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'ملاحظات الإصدار (Release Notes)'
        required: false
        default: 'تحديث وتحسينات دورية للتطبيق'

permissions:
  contents: write
  actions: write

jobs:
  build-and-release:
    name: Build Signed Release APK & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Resolve Dynamic Version Info
        id: version_info
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          # Read dynamic version from Gradle
          GRADLE_OUT=$(./gradlew :app:printVersion -q --no-daemon 2>/dev/null || true)
          VERSION_NAME=$(echo "$GRADLE_OUT" | grep 'VERSION_NAME=' | cut -d'=' -f2)
          VERSION_CODE=$(echo "$GRADLE_OUT" | grep 'VERSION_CODE=' | cut -d'=' -f2)

          # Fallback to direct calculation if not found
          if [ -z "$VERSION_NAME" ]; then
            BASE_MAJOR=1
            BASE_MINOR=42
            BASE_PATCH=4
            VERSION_NAME="$BASE_MAJOR.$BASE_MINOR.$((BASE_PATCH + GITHUB_RUN_NUMBER))"
          fi

          if [ -z "$VERSION_CODE" ]; then
            VERSION_CODE=$((144 + GITHUB_RUN_NUMBER))
          fi

          APP_ID="com.aistudio.leavetracker.kpqvbn"
          TAG="v${VERSION_NAME}"

          echo "Computed Version Name: $VERSION_NAME"
          echo "Computed Version Code: $VERSION_CODE"
          echo "Target Release Tag: $TAG"

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "application_id=$APP_ID" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"

      - name: Configure Signing Keystore
        id: keystore_setup
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="${GITHUB_WORKSPACE}/my-upload-key.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using production signing keystore provided via GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
            echo "store_pass=$STORE_PASSWORD" >> "$GITHUB_OUTPUT"
            echo "key_pass=$KEY_PASSWORD" >> "$GITHUB_OUTPUT"
          elif [ -f "my-upload-key.jks.base64" ]; then
            echo "Restoring permanent repository release signing keystore..."
            base64 -d my-upload-key.jks.base64 > "$KEYSTORE_FILE"
            echo "store_pass=android" >> "$GITHUB_OUTPUT"
            echo "key_pass=android" >> "$GITHUB_OUTPUT"
          elif [ -f "my-upload-key.jks" ]; then
            echo "Using existing repository release signing keystore..."
            echo "store_pass=android" >> "$GITHUB_OUTPUT"
            echo "key_pass=android" >> "$GITHUB_OUTPUT"
          elif [ -f "debug.keystore.base64" ]; then
            echo "Using repository debug keystore for update compatibility..."
            base64 -d debug.keystore.base64 > "$KEYSTORE_FILE"
            keytool -changealias -keystore "$KEYSTORE_FILE" -storepass android -alias androiddebugkey -destalias upload 2>/dev/null || true
            echo "store_pass=android" >> "$GITHUB_OUTPUT"
            echo "key_pass=android" >> "$GITHUB_OUTPUT"
          else
            echo "Generating fallback signing keystore..."
            keytool -genkey -v -keystore "$KEYSTORE_FILE" \
              -storepass android -alias upload -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Respite Pulse,O=AI Studio,C=US"
            echo "store_pass=android" >> "$GITHUB_OUTPUT"
            echo "key_pass=android" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Environment File (.env)
        run: |
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          elif [ ! -f ".env" ]; then
            touch .env
          fi

      - name: Build Signed Release APK with Gradle
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ steps.keystore_setup.outputs.store_pass }}
          KEY_PASSWORD: ${{ steps.keystore_setup.outputs.key_pass }}
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
        run: |
          echo "Building Release APK with dynamic versioning (Build #${{ github.run_number }})..."
          ./gradlew :app:assembleRelease --no-daemon --stacktrace -Djava.awt.headless=true

      - name: Prepare Single Release APK
        run: |
          mkdir -p release-apk
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          fi

          if [ -z "$APK_PATH" ]; then
            echo "Error: Release APK not found in build outputs!"
            exit 1
          fi

          VER="${{ steps.version_info.outputs.version_name }}"
          cp "$APK_PATH" "release-apk/RespitePulse-v${VER}.apk"
          cp "$APK_PATH" "release-apk/RespitePulse-Release.apk"
          echo "Release APKs prepared at release-apk/:"
          ls -lh release-apk/

      - name: Clean up Old Workflow Artifacts to Free Storage Quota
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Cleaning up old workflow artifacts from previous builds to prevent exceeding Actions storage quota..."
          ARTIFACT_IDS=$(gh api --paginate "repos/${{ github.repository }}/actions/artifacts" --jq '.artifacts[].id' 2>/dev/null || true)
          for art_id in $ARTIFACT_IDS; do
            if [ -n "$art_id" ]; then
              echo "Deleting old workflow artifact ID: $art_id"
              gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$art_id" 2>/dev/null || true
            fi
          done

      - name: Upload Release APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: RespitePulse-v${{ steps.version_info.outputs.version_name }}
          path: release-apk/RespitePulse-v${{ steps.version_info.outputs.version_name }}.apk
          retention-days: 1

      - name: Clean up Older Releases and Tags (Keep Only Latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking for previous releases and tags to keep only the latest release..."
          # 1. Delete all existing GitHub releases along with their tags
          PREV_RELEASES=$(gh release list --limit 100 --json tagName --jq '.[].tagName' 2>/dev/null || true)
          for rel in $PREV_RELEASES; do
            if [ -n "$rel" ]; then
              echo "Deleting older release and tag: $rel"
              gh release delete "$rel" --yes --cleanup-tag 2>/dev/null || true
            fi
          done

          # 2. Delete any lingering remote tags from git repository
          git fetch --tags 2>/dev/null || true
          for tag in $(git tag -l); do
            echo "Deleting remote tag: $tag"
            git push origin --delete "$tag" 2>/dev/null || true
            git tag -d "$tag" 2>/dev/null || true
          done

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_info.outputs.tag_name }}
          name: "Respite Pulse v${{ steps.version_info.outputs.version_name }}"
          draft: false
          prerelease: false
          make_latest: true
          files: |
            release-apk/RespitePulse-v${{ steps.version_info.outputs.version_name }}.apk
            release-apk/RespitePulse-Release.apk
          body: |
            ## 📱 تطبيق Respite Pulse v${{ steps.version_info.outputs.version_name }}

            ### 📋 معلومات الإصدار وحزمة التطبيق (Build & Release Info):
            - **اسم ملف التثبيت المباشر:** `RespitePulse-v${{ steps.version_info.outputs.version_name }}.apk`
            - **رقم الإصدار (Version Name):** `${{ steps.version_info.outputs.version_name }}`
            - **كود الإصدار (Version Code):** `${{ steps.version_info.outputs.version_code }}`
            - **معرّف الحزمة (Application ID):** `${{ steps.version_info.outputs.application_id }}`
            - **نوع الحزمة:** نسخة إطلاق رسمية موقعة بمفتاح دائم موحد (Compatible In-Place Updates)
            - **التاريخ:** ${{ github.event.head_commit.timestamp || 'Latest' }}

            ---

            ### 📥 رابط التحميل المباشر لملف الـ APK:
            - **[تحميل RespitePulse-v${{ steps.version_info.outputs.version_name }}.apk](https://github.com/${{ github.repository }}/releases/download/${{ steps.version_info.outputs.tag_name }}/RespitePulse-v${{ steps.version_info.outputs.version_name }}.apk)**
            - **[تحميل RespitePulse-Release.apk](https://github.com/${{ github.repository }}/releases/download/${{ steps.version_info.outputs.tag_name }}/RespitePulse-Release.apk)**

            ---

            ### 🚀 أبرز ميزات وتحسينات هذا الإصدار:
            - 🔄 **تثبيت التحديث مباشرة فوق النسخ السابقة**: توحيد مفتاح التوقيع الرقمي لمنع أي تعارض في الشهادات.
            - 🧹 **حذف الإصدارات والوسوم السابقة تلقائياً**: إبقاء أحدث نسخة فقط على المستودع.
            - 🏷️ **تسمية التطبيق متبوعة برقم الإصدار**: `RespitePulse-v${{ steps.version_info.outputs.version_name }}.apk`.
            - 🛡️ **قفل الحماية المتعدد**: دعم القفل بالرمز (PIN) ورسم النمط (Pattern) وبصمة الإصبع (Biometric).
            - 🎨 **ثيم النيومورفيزم (Neumorphism)**: إضافة نمط التصميم البارز والمجسم بجانب الزجاج الشفاف.
            - 🌐 **تعريب وترجمة شاملة لكافة عناصر التطبيق**.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
