<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Transparent Background: complements both light and dark themes -->
  <defs>
    <filter id="subtle-shadow" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Calendar Base Card with crisp dark navy contour for light themes & clean white fill for dark themes -->
  <g >
    <!-- Calendar Main Body -->
    <rect x="96" y="80" width="320" height="340" rx="36" ry="36" fill="#FFFFFF" stroke="#1E293B" stroke-width="14"/>
    
    <!-- Top Navy Header Banner -->
    <path d="M 96,150 L 96,116 C 96,96 112,80 132,80 L 380,80 C 400,80 416,96 416,116 L 416,150 Z" fill="#1E293B"/>
    
    <!-- Folded Corner Bottom Right -->
    <path d="M 346,420 L 416,350 L 346,350 Z" fill="#E2E8F0"/>
    <path d="M 346,420 L 346,350 L 416,350" fill="none" stroke="#1E293B" stroke-width="10" stroke-linejoin="round"/>
  </g>

  <!-- Binder Rings at the Top -->
  <!-- Left Ring -->
  <rect x="156" y="52" width="26" height="58" rx="13" ry="13" fill="#CBD5E1" stroke="#1E293B" stroke-width="8"/>
  <circle cx="169" cy="94" r="5" fill="#1E293B"/>

  <!-- Middle Ring -->
  <rect x="243" y="52" width="26" height="58" rx="13" ry="13" fill="#CBD5E1" stroke="#1E293B" stroke-width="8"/>
  <circle cx="256" cy="94" r="5" fill="#1E293B"/>

  <!-- Right Ring -->
  <rect x="330" y="52" width="26" height="58" rx="13" ry="13" fill="#CBD5E1" stroke="#1E293B" stroke-width="8"/>
  <circle cx="343" cy="94" r="5" fill="#1E293B"/>

  <!-- Vacation & Respite Fresh Emerald Leaf (Rest, Vitality, Renewal) -->
  <path d="M 276,290 C 265,240 286,202 332,184 C 352,224 340,268 300,296 C 290,302 282,300 276,290 Z" 
        fill="#10B981" stroke="#059669" stroke-width="3"/>
  <!-- Leaf Center Vein -->
  <path d="M 278,288 Q 302,252 328,190" fill="none" stroke="#D1FAE5" stroke-width="5" stroke-linecap="round"/>
  <!-- Leaf Side Veins -->
  <path d="M 292,268 Q 306,262 318,266" fill="none" stroke="#D1FAE5" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 302,248 Q 314,238 328,240" fill="none" stroke="#D1FAE5" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 288,276 Q 282,266 280,252" fill="none" stroke="#D1FAE5" stroke-width="3" stroke-linecap="round"/>

  <!-- Respite Pulse Wave (Heartbeat Vitality & Vacation Flow) -->
  <path d="M 46,285 L 160,285 L 188,285 L 208,318 L 228,206 L 256,386 L 286,266 L 312,302 L 328,285 L 466,285" 
        fill="none" stroke="#1E293B" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
